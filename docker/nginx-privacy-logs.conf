# Privacy-minimized access log for the pinned TemporalMark Nginx web image.
# This file is included at HTTP scope via /etc/nginx/conf.d/*.conf, NOT
# processed by envsubst. No client IP, URL/path/query, body, bearer/cookie,
# referrer, user agent, tenant/subject or imprint can appear in this format.
# This does NOT constrain managed ingress, error logs, application tracing or
# customized operators' logging; see ADR 0084 and open #115.
log_format temporalmark_minimal 'tm_access status=$status method=$request_method duration=$request_time';

# #143 / ADR 0108: local per-TCP-peer anonymous search admission only.
# This is shared worker memory inside ONE Nginx container, not distributed
# across pods/regions and NOT a trusted, forwarded client IP declaration.
# No access_log or error_log ever includes the raw peer address.
limit_req_zone $binary_remote_addr zone=tm_search_peer:1m rate=2r/s;

# #145 / ADR 0110: HTTP request-line parsing can reject with 414 before any
# location is selected. RFC 9110 treats 414 as heuristically cacheable;
# return no-store for this status ONLY. Empty value sends no header on all
# other responses, preserving SPA/PWA caching and backend cache directives.
# Do NOT add a global error_log crit: real RED showed no early 414 canary leak;
# suppressing all HTTP error diagnostics would be disproportionate.
map $status $tm_early_414_cache_control {
    default "";
    414 "no-store";
}
