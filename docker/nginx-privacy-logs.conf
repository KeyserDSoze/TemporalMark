# Privacy-minimized access log for the pinned TemporalMark Nginx web image.
# This file is included at HTTP scope via /etc/nginx/conf.d/*.conf, NOT
# processed by envsubst. No client IP, URL/path/query, body, bearer/cookie,
# referrer, user agent, tenant/subject or imprint can appear in this format.
# This does NOT constrain managed ingress, error logs, application tracing or
# customized operators' logging; see ADR 0084 and open #115.
log_format temporalmark_minimal 'tm_access status=$status method=$request_method duration=$request_time';
