# Development/test stack ONLY — not WORM, certified time, QTSP or production security.
services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporalmark
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: temporalmark
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporalmark -d temporalmark"]
      interval: 5s
      retries: 20
      timeout: 3s

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ["start-dev", "--import-realm", "--hostname=http://localhost:8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: dev-only-change-me
    ports: ["127.0.0.1:8081:8080"]
    volumes:
      - ./keycloak/temporalmark-realm.json:/opt/keycloak/data/import/temporalmark-realm.json:ro
      - keycloakdata:/opt/keycloak/data

  api:
    build:
      context: ..
      dockerfile: src/backend/applications/TemporalMark.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      TimestampProvider__Url: "${TIMESTAMP_PROVIDER_URL:-}"
      TimestampProvider__Id: "${TIMESTAMP_PROVIDER_ID:-}"
      ConnectionStrings__Registry: "Host=postgres;Port=5432;Database=temporalmark;Username=temporalmark;Password=local-dev-only"
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  web:
    build:
      context: ..
      dockerfile: src/frontend/Dockerfile
      args:
        VITE_OIDC_AUTHORITY: "http://localhost:8081/realms/temporalmark"
    restart: unless-stopped
    ports: ["127.0.0.1:3000:80"]
    environment:
      API_UPSTREAM: "http://api:8080"
      NGINX_ENVSUBST_FILTER: "^API_UPSTREAM$"
    depends_on: ["api"]

volumes:
  pgdata:
  keycloakdata:
