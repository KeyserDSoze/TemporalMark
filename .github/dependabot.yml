version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule: { interval: weekly }
  - package-ecosystem: "npm"
    directory: "/src/frontend"
    schedule: { interval: weekly }
  - package-ecosystem: "npm"
    directory: "/tests/frontend"
    schedule: { interval: weekly }
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: weekly }
  - package-ecosystem: "terraform"
    directory: "/infra/azure"
    schedule: { interval: weekly }
