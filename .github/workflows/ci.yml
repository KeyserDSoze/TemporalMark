name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify immutable GitHub Action source references
        run: |
          # RED-first #126: Azure private runner live preflight (mocked CLI/DNS in CI).
          python3 -m unittest discover -s tests/integration -p 'test_azure_private_blob_preflight.py' -v
          # #129 / ADR 0095: computed SQL admin fields are unknown in Terraform mock plans.
          # Reject any source-declared SQL admin password in the isolated candidate.
          # #134 / ADR 0100: explicit API Entra mode, no hidden auto-selection.
          python3 -m unittest discover -s tests/integration -p 'test_api_entra_postgres_optin.py' -v
          python3 -m unittest discover -s tests/integration -p 'test_azure_entra_candidate_source.py' -v
          python3 -m unittest discover -s tests/integration -p 'test_check_ci_action_pins.py' -v
          python3 tests/integration/check_ci_action_pins.py
          python3 -m unittest discover -s tests/integration -p 'test_check_ci_action_runtimes.py' -v
          python3 tests/integration/check_ci_action_runtimes.py
          python3 -m unittest discover -s tests/integration -p 'test_check_npm_lockfiles.py' -v
          python3 tests/integration/check_npm_lockfiles.py
          python3 -m unittest discover -s tests/integration -p 'test_check_container_image_pins.py' -v
          python3 tests/integration/check_container_image_pins.py
          python3 -m unittest discover -s tests/integration -p 'test_check_sbom_workflow.py' -v
          python3 tests/integration/check_sbom_workflow.py
          python3 -m unittest discover -s tests/integration -p 'test_generate_npm_sbom.py' -v
          python3 -m unittest discover -s tests/integration -p 'test_check_nuget_sbom_workflow.py' -v
          python3 tests/integration/check_nuget_sbom_workflow.py
          python3 -m unittest discover -s tests/integration -p 'test_generate_nuget_sbom.py' -v
          python3 -m unittest discover -s tests/integration -p 'test_check_nuget_lockfiles.py' -v
          python3 tests/integration/check_nuget_lockfiles.py
          # RED-first #101: final SHA status must never claim a skipped core job passed.
          # RED-first #117: enforce explicit Nginx access-only field allowlist.
          python3 -m unittest discover -s tests/integration -p 'test_nginx_access_privacy.py' -v
          # #145 / ADR 0110: early Nginx 414 no-store, no global error-log suppression.
          python3 -m unittest discover -s tests/integration -p 'test_nginx_early_414_privacy.py' -v
          # RED-first #136: scoped pre-auth 4KiB search POST Kestrel + Nginx body gate.
          python3 -m unittest discover -s tests/integration -p 'test_imprint_search_body_budget.py' -v
          # #143 / ADR 0108: local anonymous burst gate and fixed error privacy.
          python3 -m unittest discover -s tests/integration -p 'test_imprint_search_nginx_edge_limit.py' -v
          # RED-first #119: API/Kestrel request logging must remain content-free.
          python3 -m unittest discover -s tests/integration -p 'test_api_diagnostic_privacy.py' -v
          # RED-first #121: exact Keycloak callback allowlist and collision-resilient bind.
          python3 -m unittest discover -s tests/integration -p 'test_disposable_mfa_callback_fallback.py' -v
          python3 -m unittest discover -s tests/integration -p 'test_publish_ci_verdict.py' -v
          # RED-first #107: offline ZIP integrity without legal/trust assertions.
          python3 -m unittest discover -s tests/integration -p 'test_verify_period_export.py' -v
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Restore all nine .NET projects in locked mode
        run: |
          set -euo pipefail
          projects="$(find src/backend tests/backend -type f -name '*.csproj' | sort)"
          test "$(printf '%s\n' "$projects" | wc -l)" -eq 9
          while IFS= read -r project; do
            dotnet restore "$project" --locked-mode
          done <<< "$projects"
      - name: Domain tests
        run: dotnet test tests/backend/TemporalMark.Domain.Tests/TemporalMark.Domain.Tests.csproj --configuration Release --no-restore
      - name: Business tests
        run: dotnet test tests/backend/TemporalMark.Business.Tests/TemporalMark.Business.Tests.csproj --configuration Release --no-restore
      - name: Provisioning JWT signature and expiry tests
        run: dotnet test tests/backend/TemporalMark.Provisioner.Tests/TemporalMark.Provisioner.Tests.csproj --configuration Release --no-restore
      - name: Publish API
        run: dotnet publish src/backend/applications/TemporalMark.Api/TemporalMark.Api.csproj --configuration Release --output /tmp/temporalmark-api --no-restore
      - name: Reject unknown and development-only Entra PostgreSQL API modes before listening (#134)
        run: |
          set -euo pipefail
          api="/tmp/temporalmark-api/TemporalMark.Api.dll"
          # Real published .NET entrypoint, no listener, no SQL or Azure socket.
          # Never output credential-bearing stdout/stderr from these probes.
          if output="$(env ASPNETCORE_ENVIRONMENT=Development RegistryPostgres__AuthenticationMode=TYPO-UNKNOWN dotnet "$api" 2>&1)"; then
            echo "Unknown registry auth mode unexpectedly started API"; exit 1
          fi
          printf '%s' "$output" | grep -Fq 'Unsupported PostgreSQL authentication mode'
          if printf '%s' "$output" | grep -Fq 'Now listening on'; then
            echo "Unknown mode opened HTTP listener"; exit 1
          fi
          if output="$(env ASPNETCORE_ENVIRONMENT=Development RegistryPostgres__AuthenticationMode=ContainerAppsEntraCandidate dotnet "$api" 2>&1)"; then
            echo "Development Entra mode unexpectedly started API"; exit 1
          fi
          printf '%s' "$output" | grep -Fq 'Registry PostgreSQL Entra startup denied'
          if printf '%s' "$output" | grep -Fq 'Now listening on'; then
            echo "Development Entra mode opened HTTP listener"; exit 1
          fi
          if output="$(env ASPNETCORE_ENVIRONMENT=Production RegistryPostgres__AuthenticationMode=ContainerAppsEntraCandidate RegistryPostgres__UserAssignedClientId=22222222-2222-4222-8222-222222222222 RegistryPostgres__ExpectedRuntimeLogin=tm-api-mi IDENTITY_ENDPOINT=http://localhost:42356/msi/token IDENTITY_HEADER=ACA-SECRET-HEADER-CANARY ConnectionStrings__Registry='Host=evil.example.org;Database=temporalmark;Username=tm-api-mi;Password=SQL-SECRET-CANARY;SSL Mode=Require' dotnet "$api" 2>&1)"; then
            echo "Unsafe Entra SQL configuration unexpectedly started API"; exit 1
          fi
          printf '%s' "$output" | grep -Fq 'Registry PostgreSQL Entra startup denied'
          if printf '%s' "$output" | grep -Eq 'ACA-SECRET-HEADER-CANARY|SQL-SECRET-CANARY|evil[.]example[.]org|Now listening on'; then
            echo "Sensitive data leak or unexpected HTTP listener in startup failure"; exit 1
          fi
          echo 'PASS: published API rejects unknown, development Entra and unsafe production Entra configuration before HTTP without secret leakage.'

      - name: Publish isolated operator provisioning CLI
        run: dotnet publish src/backend/applications/TemporalMark.Provisioner/TemporalMark.Provisioner.csproj --configuration Release --output /tmp/temporalmark-provisioner --no-restore
      - name: Registrar V015 CLI cannot run before signed ceremony
        run: |
          set -eu
          if output="$(dotnet run --no-restore --project src/backend/applications/TemporalMark.Provisioner/TemporalMark.Provisioner.csproj --configuration Release -- registrar-intent --registrar-token-file /dev/null --reviewer-token-file /dev/null 2>&1)"; then
            echo "Unexpected successful registrar issue command"; exit 1
          fi
          # Exact explanatory denial is required; missing config/invalid
          # token or Keycloak outage must not masquerade as the interlock.
          printf '%s\n' "$output" | grep -Fq 'V015 registrar intent issuance suspended'
      - name: Generate NuGet restore CycloneDX inventory
        run: python3 tests/integration/generate_nuget_sbom.py generate --output-dir "$RUNNER_TEMP/temporalmark-nuget-sbom"
      - name: Verify NuGet restore CycloneDX inventory
        run: python3 tests/integration/generate_nuget_sbom.py verify --output-dir "$RUNNER_TEMP/temporalmark-nuget-sbom"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-restored-cyclonedx
          path: ${{ runner.temp }}/temporalmark-nuget-sbom/*.json
          if-no-files-found: error
          retention-days: 7

  frontend:
    # Playwright 1.56.x Chromium does not support GitHub's Ubuntu 26.04 runner.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Install and build React PWA
        working-directory: src/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install Playwright
        working-directory: tests/frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Playwright desktop/mobile smoke
        working-directory: tests/frontend
        run: npm test
      - name: Generate npm lockfile CycloneDX inventories
        run: |
          python3 tests/integration/generate_npm_sbom.py generate --output-dir "$RUNNER_TEMP/temporalmark-npm-sbom"
      - name: Verify npm lockfile CycloneDX inventories
        run: |
          python3 tests/integration/generate_npm_sbom.py verify --output-dir "$RUNNER_TEMP/temporalmark-npm-sbom"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-lockfile-cyclonedx
          path: ${{ runner.temp }}/temporalmark-npm-sbom/*.json
          if-no-files-found: error
          retention-days: 7

  docker-smoke:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build local application containers
        run: docker compose -f docker/compose.yml build api web
      - name: Run local integration stack
        run: docker compose -f docker/compose.yml up -d
      - name: API/frontend health
        run: |
          # Cold-start connection resets must be retried too.
          curl -fsS --retry 40 --retry-delay 3 --retry-all-errors --retry-connrefused http://127.0.0.1:8080/healthz
          curl -fsS --retry 40 --retry-delay 3 --retry-all-errors --retry-connrefused http://127.0.0.1:3000/
          curl -fsS --retry 40 --retry-delay 3 --retry-all-errors --retry-connrefused http://127.0.0.1:8081/realms/temporalmark/.well-known/openid-configuration
      - name: Real pinned Nginx web-container access log confidentiality (#117)
        env:
          TEMPORALMARK_CI_NGINX_ACCESS_PRIVACY: "1"
        run: python3 tests/integration/nginx-access-privacy.py
      - name: Real API and Nginx 4KiB imprint-search 413/body privacy boundary (#136)
        env:
          TEMPORALMARK_CI_SEARCH_BODY_BUDGET: "1"
        run: python3 tests/integration/imprint-search-body-budget.py
      - name: Real API container normal request log confidentiality (#119)
        env:
          TEMPORALMARK_CI_API_LOG_PRIVACY: "1"
        run: python3 tests/integration/api-diagnostic-privacy.py
      # #145 / ADR 0110: parsing-time Nginx 414 precedes location guards.
      - name: Real Nginx pre-location 414 no-store and error privacy (#145)
        env:
          TEMPORALMARK_CI_NGINX_EARLY_414: "1"
        run: python3 tests/integration/nginx-early-414-privacy.py
      # #143 / ADR 0108: RED-first live Nginx anonymous search burst.
      - name: Real Nginx pre-auth search peer burst 429 and log privacy (#143)
        env:
          TEMPORALMARK_CI_NGINX_EDGE_LIMIT: "1"
        run: python3 tests/integration/imprint-search-nginx-edge-limit.py
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Install browser integration test runner
        working-directory: tests/frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Production PWA service-worker API navigation safety (RED/GREEN #71)
        working-directory: tests/frontend
        run: npx playwright test --config pwa-security.config.ts
      - name: Production mobile-emulated manifest and offline installability (#80)
        working-directory: tests/frontend
        run: npx playwright test --config pwa-mobile.config.ts
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Reapply migrations to prove checksum-safe idempotency
        run: docker compose -f docker/compose.yml run --rm migrate
      - name: Verify versioned migration state is persistent
        run: |
          test "$(docker compose -f docker/compose.yml exec -T postgres psql -U temporalmark -d temporalmark -tAc 'SELECT count(*) FROM schema_migrations')" = "20"
      - name: PostgreSQL migration and tenant concurrency tests
        env:
          TEMPORALMARK_RUNTIME_TEST_DB: "Host=127.0.0.1;Port=5432;Database=temporalmark;Username=temporalmark_api;Password=local-dev-only"
          TEMPORALMARK_TEST_DB: "Host=127.0.0.1;Port=5432;Database=temporalmark;Username=temporalmark;Password=local-dev-only"
          TEMPORALMARK_PROVISIONING_TEST_DB: "Host=127.0.0.1;Port=5432;Database=temporalmark;Username=temporalmark_provisioner;Password=local-provisioner-only"
          TEMPORALMARK_APPROVER_TEST_DB: "Host=127.0.0.1;Port=5432;Database=temporalmark;Username=temporalmark_approver;Password=local-approver-only"
        run: dotnet test tests/backend/TemporalMark.Postgres.Tests/TemporalMark.Postgres.Tests.csproj --configuration Release -p:RestoreLockedMode=true
      - name: Real PostgreSQL full logical pg_dump and pg_restore sealed-witness rollback regression
        env:
          TEMPORALMARK_TEST_DB: "Host=127.0.0.1;Port=5432;Database=temporalmark;Username=temporalmark;Password=local-dev-only"
        run: bash tests/integration/mds-full-pgdump-restore.sh
      - name: OIDC-signed operator enrollment and database replay smoke
        run: bash tests/integration/provisioning-smoke.sh
      - name: Real browser Keycloak registrar + reviewer TOTP/PKCE, live current-role .NET smoke
        env:
          TEMPORALMARK_CI_MFA_TOKEN_FILE: ${{ runner.temp }}/temporalmark-ci-verified-mfa.jwt
          TEMPORALMARK_CI_REGISTRAR_TOKEN_FILE: ${{ runner.temp }}/temporalmark-ci-registrar-mfa.jwt
        run: |
          umask 077
          trap 'rm -f "$TEMPORALMARK_CI_MFA_TOKEN_FILE" "$TEMPORALMARK_CI_REGISTRAR_TOKEN_FILE"' EXIT
          # CI-only master realm setup grants view-users/view-realm/query-users
          # to an MFA-realm service account; never manage-users or SQL registrar.
          python3 tests/integration/configure-keycloak-registrar-mfa-ci.py prepare
          # Force the CI-only primary redirect listener port to be occupied;
          # real browser TOTP + Code/PKCE must bind an explicitly registered fallback.
          TEMPORALMARK_CI_MFA_FALLBACK=1 python3 tests/integration/run-mfa-with-blocked-primary-callback.py
          (cd tests/frontend && npx playwright test --config registrar-mfa.config.ts)
          # Both browser sessions required real password + TOTP and signed
          # Keycloak audience-specific access tokens, not password grants.
          # Actual production OIDC, RFC7662, and current-directory adapters.
          dotnet test tests/backend/TemporalMark.Provisioner.Tests/TemporalMark.Provisioner.Tests.csproj --configuration Release -p:RestoreLockedMode=true --filter 'FullyQualifiedName~RealKeycloakMfaEndToEndTests|FullyQualifiedName~RealKeycloakRegistrarMfaEndToEndTests'
          # The exact SAME still-signed bearer must now be denied because a
          # current role was removed AFTER token issuance. No cached results.
          python3 tests/integration/configure-keycloak-registrar-mfa-ci.py remove-registrar-role
          TEMPORALMARK_CI_REGISTRAR_EXPECT_DENIAL=true dotnet test tests/backend/TemporalMark.Provisioner.Tests/TemporalMark.Provisioner.Tests.csproj --configuration Release -p:RestoreLockedMode=true --filter 'FullyQualifiedName~RealKeycloakRegistrarMfaEndToEndTests'
          # Restore role solely to isolate the disabled-account test.
          python3 tests/integration/configure-keycloak-registrar-mfa-ci.py restore-registrar-role
          python3 tests/integration/configure-keycloak-registrar-mfa-ci.py disable-registrar
          TEMPORALMARK_CI_REGISTRAR_EXPECT_DENIAL=true dotnet test tests/backend/TemporalMark.Provisioner.Tests/TemporalMark.Provisioner.Tests.csproj --configuration Release -p:RestoreLockedMode=true --filter 'FullyQualifiedName~RealKeycloakRegistrarMfaEndToEndTests'
      - name: OIDC admin login and disabled external TSA smoke
        working-directory: tests/frontend
        run: npx playwright test --config authenticated.config.ts
      # This destructive CI-only canary fixture runs LAST: the original
      # authenticated browser smoke intentionally starts from an empty registry.
      - name: Real two-tenant signed Keycloak and PostgreSQL API 401/403 isolation (#82)
        env:
          TEMPORALMARK_CI_API_ISOLATION: "1"
        run: python3 tests/integration/api-tenant-isolation.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: authenticated-browser-failure
          path: tests/frontend/test-results/
          retention-days: 3
      - name: Diagnostics
        if: failure()
        run: docker compose -f docker/compose.yml logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose -f docker/compose.yml --profile witness-ci down -v

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      - name: Terraform format
        run: terraform -chdir=infra/azure fmt -diff -check -recursive
      - name: Terraform init without remote backend
        run: terraform -chdir=infra/azure init -backend=false
      - name: Terraform validate
        run: terraform -chdir=infra/azure validate
      - name: Plan-only Terraform mock-provider OCI image digest policy (#120)
        run: terraform -chdir=infra/azure test -no-color -filter=tests/image_pins.tftest.hcl
      - name: Plan-only Terraform mock-provider OIDC issuer policy (#122)
        run: terraform -chdir=infra/azure test -no-color -filter=tests/oidc_issuer.tftest.hcl
      - name: Plan-only Terraform private ingress boundary policy (#123)
        run: terraform -chdir=infra/azure test -no-color -filter=tests/ingress_boundary.tftest.hcl
      - name: Plan-only Terraform internal environment load balancer policy (#124)
        run: terraform -chdir=infra/azure test -no-color -filter=tests/environment_boundary.tftest.hcl
      - name: Plan-only Terraform private evidence Blob network policy (#125)
        run: terraform -chdir=infra/azure test -no-color -filter=tests/evidence_blob_private_network.tftest.hcl
      - name: Plan-only Terraform API Key Vault secret-state boundary (#127)
        run: terraform -chdir=infra/azure test -no-color -filter=tests/api_key_vault_reference.tftest.hcl
      - name: Init isolated Entra-only PostgreSQL new-server candidate (NO Azure apply) (#129)
        run: terraform -chdir=infra/azure/candidates/entra_postgres init -backend=false
      - name: Plan-only isolated Entra PostgreSQL auth and private-network policy (#129)
        run: terraform -chdir=infra/azure/candidates/entra_postgres test -no-color -filter=tests/entra_only_candidate.tftest.hcl

  # A fifth reporting-only job. The four core test jobs stay unmodified.
  # GitHub REST Commit Status becomes readable through the connected
  # GitHub integration even when push-triggered Actions runs are not.
  ci-verdict:
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    needs: [backend, frontend, docker-smoke, terraform]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Publish exact-SHA four-core-job commit status
        env:
          CORE_JOB_NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tests/integration/publish_ci_verdict.py
