name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Domain tests
        run: dotnet test tests/backend/TemporalMark.Domain.Tests/TemporalMark.Domain.Tests.csproj --configuration Release
      - name: Business tests
        run: dotnet test tests/backend/TemporalMark.Business.Tests/TemporalMark.Business.Tests.csproj --configuration Release
      - name: Provisioning JWT signature and expiry tests
        run: dotnet test tests/backend/TemporalMark.Provisioner.Tests/TemporalMark.Provisioner.Tests.csproj --configuration Release
      - name: Publish API
        run: dotnet publish src/backend/applications/TemporalMark.Api/TemporalMark.Api.csproj --configuration Release --output /tmp/temporalmark-api
      - name: Publish isolated operator provisioning CLI
        run: dotnet publish src/backend/applications/TemporalMark.Provisioner/TemporalMark.Provisioner.csproj --configuration Release --output /tmp/temporalmark-provisioner

  frontend:
    # Playwright 1.56.x Chromium does not support GitHub's Ubuntu 26.04 runner.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and build React PWA
        working-directory: src/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Install Playwright
        working-directory: tests/frontend
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Playwright desktop/mobile smoke
        working-directory: tests/frontend
        run: npm test

  docker-smoke:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build local application containers
        run: docker compose -f docker/compose.yml build api web
      - name: Run local integration stack
        run: docker compose -f docker/compose.yml up -d
      - name: API/frontend health
        run: |
          # Cold-start connection resets must be retried too.
          curl -fsS --retry 40 --retry-delay 3 --retry-all-errors --retry-connrefused http://127.0.0.1:8080/healthz
          curl -fsS --retry 40 --retry-delay 3 --retry-all-errors --retry-connrefused http://127.0.0.1:3000/
          curl -fsS --retry 40 --retry-delay 3 --retry-all-errors --retry-connrefused http://127.0.0.1:8081/realms/temporalmark/.well-known/openid-configuration
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser integration test runner
        working-directory: tests/frontend
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Reapply migrations to prove checksum-safe idempotency
        run: docker compose -f docker/compose.yml run --rm migrate
      - name: Verify versioned migration state is persistent
        run: |
          test "$(docker compose -f docker/compose.yml exec -T postgres psql -U temporalmark -d temporalmark -tAc 'SELECT count(*) FROM schema_migrations')" = "10"
      - name: PostgreSQL migration and tenant concurrency tests
        env:
          TEMPORALMARK_TEST_DB: "Host=127.0.0.1;Port=5432;Database=temporalmark;Username=temporalmark;Password=local-dev-only"
          TEMPORALMARK_PROVISIONING_TEST_DB: "Host=127.0.0.1;Port=5432;Database=temporalmark;Username=temporalmark_provisioner;Password=local-provisioner-only"
          TEMPORALMARK_APPROVER_TEST_DB: "Host=127.0.0.1;Port=5432;Database=temporalmark;Username=temporalmark_approver;Password=local-approver-only"
        run: dotnet test tests/backend/TemporalMark.Postgres.Tests/TemporalMark.Postgres.Tests.csproj --configuration Release
      - name: OIDC-signed operator enrollment and database replay smoke
        run: bash tests/integration/provisioning-smoke.sh
      - name: Real browser Keycloak TOTP, PKCE and production-path .NET ACR policy smoke
        env:
          TEMPORALMARK_CI_MFA_TOKEN_FILE: ${{ runner.temp }}/temporalmark-ci-verified-mfa.jwt
        run: |
          umask 077
          trap 'rm -f "$TEMPORALMARK_CI_MFA_TOKEN_FILE"' EXIT
          (cd tests/frontend && npx playwright test --config mfa.config.ts)
          # Unlike the disposable password-grant fixture, this second check
          # uses a REAL Keycloak-signed MFA access token and NO test bypass.
          dotnet test tests/backend/TemporalMark.Provisioner.Tests/TemporalMark.Provisioner.Tests.csproj --configuration Release --filter 'FullyQualifiedName~RealKeycloakMfaEndToEndTests'
      - name: OIDC admin login and disabled external TSA smoke
        working-directory: tests/frontend
        run: npx playwright test --config authenticated.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: authenticated-browser-failure
          path: tests/frontend/test-results/
          retention-days: 3
      - name: Diagnostics
        if: failure()
        run: docker compose -f docker/compose.yml logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose -f docker/compose.yml down -v

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform format
        run: terraform -chdir=infra/azure fmt -check -recursive
      - name: Terraform init without remote backend
        run: terraform -chdir=infra/azure init -backend=false
      - name: Terraform validate
        run: terraform -chdir=infra/azure validate
